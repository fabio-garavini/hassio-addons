source:
  type: docker
  repo: medplum/medplum-server
  current_version: 5.2.18
  version_template: regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
config:
  version_template: "{{major}}.{{minor}}.{{patch}}-ha{{app_build}}"
  build: 0
  image: fabioogaravini/hassio-medplum
build:
  image: node
  version_template: 24.22.1-trixie-slim
  source_version_arg: MEDPLUM_VERSION
changelog:
  source: github-releases
  repo: medplum/medplum
  version_template: v{{major}}.{{minor}}.{{patch}}
test:
  enable: true
