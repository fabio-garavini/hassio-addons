source:
  type: github-releases
  repo: jellyfin/jellyfin
  current_version: v10.11.11
  version_template: regex:^v(?<major>\d+)\.(?<minor>\d+)(?<rest>\.(?<patch>\d+))?$
config:
  version_template: "{{major}}.{{minor}}.{{patch|0}}-ha{{app_build}}"
  build: 0
  image: fabioogaravini/hassio-jellyfin
build:
  image: jellyfin/jellyfin
  version_template: "{{major}}.{{minor}}{{rest|}}"
changelog:
  source: github-releases
  repo: jellyfin/jellyfin
  version_template: v{{major}}.{{minor}}{{rest|}}
test:
  enable: true
