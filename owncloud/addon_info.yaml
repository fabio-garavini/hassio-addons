source:
  type: docker
  repo: docker.io/owncloud/server
  current_version: 11.0.1
  version_template: regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
config:
  version_template: "{{major}}.{{minor}}.{{patch}}-ha{{app_build}}"
  build: 1
  image: fabioogaravini/hassio-owncloud
build:
  image: docker.io/owncloud/server
  version_template: "{{major}}.{{minor}}.{{patch}}"
changelog:
  source: none
  version_template: "{{major}}.{{minor}}.{{patch}}"
test:
  enable: true
