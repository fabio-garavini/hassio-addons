source:
  type: github-releases
  repo: linuxserver/docker-nextcloud
  current_version: 35.0.1-ls452
  version_template: regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-ls(?<build>\d+)$
config:
  version_template: "{{major}}.{{minor}}.{{patch}}-ha{{app_build}}"
  build: 4
  image: fabioogaravini/hassio-nextcloud
build:
  image: ghcr.io/linuxserver/nextcloud
  version_template: "{{major}}.{{minor}}.{{patch}}-ls{{build}}"
changelog:
  source: github-releases
  repo: nextcloud-releases/server
  version_template: v{{major}}.{{minor}}.{{patch}}
test:
  enable: true
