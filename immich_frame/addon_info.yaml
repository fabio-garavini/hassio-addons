source:
  type: docker
  repo: ghcr.io/immichframe/immichframe
  current_version: v1.0.38.0
  version_template: regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)\.(?<build>\d+)$
config:
  version_template: "{{major}}.{{minor}}.{{patch}}.{{build}}-ha{{app_build}}"
  build: 1
  image: fabioogaravini/hassio-immich-frame
build:
  image: ghcr.io/immichframe/immichframe
  version_template: v{{major}}.{{minor}}.{{patch}}.{{build}}
changelog:
  source: github-releases
  repo: immichFrame/ImmichFrame
  version_template: v{{major}}.{{minor}}.{{patch}}.{{build}}
test:
  enable: true
