name: Hotpot
version: 0.4.0-ha2
slug: hotpot
description: Heatmap renderer and tile server for GPS activity data
url: https://github.com/erik/hotpot
ingress: true
ingress_stream: true
panel_title: Hotpot
panel_icon: mdi:map-marker
panel_admin: false
arch:
  - aarch64
  - amd64
init: false
map:
  - type: share
    read_only: false
  - type: ssl
backup: cold
schema:
  TZ: str?
  ssl: bool
  certfile: str?
  keyfile: str?
  UPLOAD: bool
  RENDER: bool
  INSPECT: bool
  FETCH: bool
  STRAVA_WEBHOOK: bool
  CORS: bool
  VERBOSE: bool
  HOTPOT_UPLOAD_TOKEN: password?
  INTERVALS_ICU_API_KEY: password?
  STRAVA_CLIENT_ID: str?
  STRAVA_CLIENT_SECRET: password?
  STRAVA_WEBHOOK_SECRET: password?
options:
  TZ: Etc/UTC
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  UPLOAD: false
  RENDER: false
  INSPECT: true
  FETCH: false
  STRAVA_WEBHOOK: false
  CORS: false
  VERBOSE: false
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Web UI and tile server (not required for Ingress)
image: fabioogaravini/hassio-hotpot
