# Hotpot embeds root-relative URLs in its HTML and JavaScript. Home Assistant
# strips the ingress prefix before forwarding requests, so add it back to URLs
# returned to the browser. Without the header these replacements are unchanged.
sub_filter_once off;
sub_filter_types text/javascript application/javascript;
sub_filter 'href="/' 'href="$http_x_ingress_path/';
sub_filter 'src="/' 'src="$http_x_ingress_path/';
sub_filter '"/api/' '"$http_x_ingress_path/api/';
sub_filter '"/tile/' '"$http_x_ingress_path/tile/';
sub_filter '"/upload"' '"$http_x_ingress_path/upload"';
sub_filter '`/api/' '`$http_x_ingress_path/api/';
sub_filter '`/render?' '`$http_x_ingress_path/render?';

# OpenFreeMap currently refers to "circle-11" while its sprite uses "circle_11".
# Alias the existing sprite image to avoid MapLibre warnings while zooming.
sub_filter '        const nodes = {' '        map.on("styleimagemissing", (event) => { if (event.id === "circle-11" && map.hasImage("circle_11") && !map.hasImage(event.id)) { map.addImage(event.id, map.getImage("circle_11").data); } });
        const nodes = {';
