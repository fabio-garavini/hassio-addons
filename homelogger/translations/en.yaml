configuration:
  CURRENCY:
    name: Currency
    description: >-
      ISO 4217 currency code used to display amounts (e.g. USD, EUR, GBP).
      Invalid values prevent the app from starting
  DEMO_MODE:
    name: Demo Mode
    description: >-
      Load sample data and reset the database every 10 minutes to explore the
      app. Warning: demo data replaces existing records
  ssl:
    name: SSL
    description: >-
      Enable HTTPS connections. If `SSL Certfile` and `SSL Private Key` files exist they are used to encrypt the connection, otherwise it'll generate a self-signed certificate
  certfile:
    name: SSL Certificate File
    description: >-
      Name of the SSL certificate file located under the `/ssl/` directory.
  keyfile:
    name: SSL Private Key File
    description: >-
      Name of the SSL private key file located under the `/ssl/` directory.
network:
  8080/tcp: Web UI
