name: HomeLogger
version: 0.6.0-ha1
slug: homelogger
description: An open source self-hosted home maintenance and asset tracker
url: https://github.com/FrancisLaboratories/homelogger
webui: "[PROTO:ssl]://[HOST]:[PORT:8080]"
arch:
  - aarch64
  - amd64
init: false
map:
  - type: app_config
    read_only: false
  - type: ssl
backup: cold
schema:
  CURRENCY: str
  DEMO_MODE: bool
  ssl: bool
  certfile: str?
  keyfile: str?
options:
  CURRENCY: USD
  DEMO_MODE: false
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
ports:
  8080/tcp: 3005
ports_description:
  8080/tcp: Web UI
image: fabioogaravini/hassio-homelogger
