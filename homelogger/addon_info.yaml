source:
  type: docker
  repo: francislaboratories/homelogger
  current_version: 0.6.0
  version_template: regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
config:
  version_template: "{{major}}.{{minor}}.{{patch}}-ha{{app_build}}"
  build: 1
  image: fabioogaravini/hassio-homelogger
build:
  image: francislaboratories/homelogger
  version_template: "{{major}}.{{minor}}.{{patch}}"
changelog:
  source: github-releases
  repo: FrancisLaboratories/homelogger
  version_template: "{{major}}.{{minor}}.{{patch}}"
test:
  enable: true
