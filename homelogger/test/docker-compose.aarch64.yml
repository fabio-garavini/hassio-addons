name: homelogger-aarch64
services:
  homelogger-aarch64:
    image: fabioogaravini/hassio-homelogger:${VERSION:-latest}-aarch64
    build:
      context: ..
      args:
        BUILD_ARCH: aarch64
        BUILD_VERSION: ${VERSION:-latest}
    container_name: homelogger-aarch64
    ports:
      - 3005:8080
    environment:
      - TZ=Etc/UTC
    volumes:
      - data:/data
      - ./options.json:/data/options.json:ro
      - config:/config
      - ssl:/ssl
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://127.0.0.1:8080/api/health | jq -e '.db == \"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
  config:
  ssl:
