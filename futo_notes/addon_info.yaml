source:
  type: gitlab-tags
  registry: https://gitlab.futo.org
  repo: futo-notes/futo-notes-server
  current_version: v0.7.1
  version_template: regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
config:
  version_template: "{{major}}.{{minor}}.{{patch}}-ha{{app_build}}"
  build: 2
  image: fabioogaravini/hassio-futo_notes
build:
  image: debian
  version_template: bookworm-slim
changelog:
  source: none
  version_template: "{{major}}.{{minor}}.{{patch}}"
test:
  enable: true
