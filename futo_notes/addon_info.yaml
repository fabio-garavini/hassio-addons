source:
  type: gitlab-tags
  registry: https://gitlab.futo.org
  repo: futo-notes/futo-notes-server
  current_version: v0.7.0
  version_template: regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
config:
  version_template: "{{major}}.{{minor}}.{{patch}}"
  patch: 0
  image: fabioogaravini/hassio-futo_notes
build:
  image: oven/bun
  version_template: "alpine"
changelog:
  source: none
  version_template: "{{major}}.{{minor}}.{{patch}}"
test:
  enable: true
