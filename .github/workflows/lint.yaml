name: Lint

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

env:
  SHELLCHECK_OPTS: -e SC1008 -s bash

jobs:
  yamllint:
    runs-on: ubuntu-latest
    name: YAMLLint
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run YAMLLint
        uses: frenck/action-yamllint@v1.5
        with:
          config: ".github/yamllint.yaml"

  find:
    name: Find add-ons
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7

      - name: 📄 Get changed files
        id: changed_files
        uses: masesgroup/retrieve-changed-files@v4

      - name: 🔍 Find add-ons
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Get changed add-ons
        id: changed_addons
        run: |
          declare -a changed_addons
          for addon in ${{ steps.addons.outputs.addons }}; do
            if [[ "${{ steps.changed_files.outputs.all }}" =~ $addon ]]; then
              if [[ ! "${changed_addons[@]}" =~ $addon ]]; then
                changed_addons+=("\"${addon}\",");
              fi
            fi
          done

          changed=$(echo ${changed_addons[@]} | rev | cut -c 2- | rev)

          if [[ -n ${changed} ]]; then
            echo "Changed add-ons: $changed";
            echo "changed=true" >> $GITHUB_OUTPUT;
            echo "addons=[$changed]" >> $GITHUB_OUTPUT;
          else
            echo "No add-on had any monitored files changed";
          fi

  lint:
    name: Lint add-on ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    if: needs.find.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
      
      - name: Check if Dockerfile exists
        id: dockerfile
        shell: bash
        run: |
          if [[ -f "./${{ matrix.path }}/Dockerfile" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hadolint
        if: steps.dockerfile.outputs.exists == 'true'
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: ./${{ matrix.path }}/Dockerfile
          config: ./.github/hadolint.yaml

      - name: 🚀 Run Home Assistant Add-on Lint
        uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.path }}
