name: Foldergram
version: 1.4.0-ha2
slug: foldergram
description: Self-hosted folder-based Instagram-style photo and video gallery
url: https://github.com/foldergram/foldergram
ingress: true
ingress_stream: true
panel_title: Foldergram
panel_icon: mdi:instagram
panel_admin: false
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
map:
  - type: app_config
    read_only: false
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: ssl
backup: cold
backup_exclude:
  - "**/logs"
schema:
  TZ: str?
  ssl: bool
  certfile: str?
  keyfile: str?
  GALLERY_ROOT: str
  GALLERY_EXCLUDED_FOLDERS: str?
  DERIVATIVE_MODE: list(eager|lazy)
  IMAGE_DETAIL_SOURCE: list(preview|original)
  VIDEO_DELIVERY_MODE: list(streaming|previews)?
  HLS_CACHE_DIR: str?
  HLS_CACHE_MAX_BYTES: int(1,)?
  HLS_CACHE_MAX_AGE_HOURS: float(0.0,)?
  HLS_TRANSCODE_CONCURRENCY: int(1,8)?
  CSRF_TRUSTED_ORIGINS: str?
  env_vars:
    - key: match(^[A-Za-z0-9_-]+$)
      value: str
options:
  TZ: Etc/UTC
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  GALLERY_ROOT: /media/foldergram
  GALLERY_EXCLUDED_FOLDERS: ""
  DERIVATIVE_MODE: eager
  IMAGE_DETAIL_SOURCE: preview
  env_vars: []
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Web UI (not required for Ingress)
image: fabioogaravini/hassio-foldergram
