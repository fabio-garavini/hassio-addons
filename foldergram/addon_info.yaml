source:
  type: github-releases
  repo: foldergram/foldergram
  current_version: v1.4.1
  version_template: regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
config:
  version_template: "{{major}}.{{minor}}.{{patch}}-ha{{app_build}}"
  build: 3
  image: fabioogaravini/hassio-foldergram
build:
  image: ghcr.io/foldergram/foldergram
  version_template: "{{major}}.{{minor}}.{{patch}}"
changelog:
  source: github-releases
  repo: foldergram/foldergram
  version_template: v{{major}}.{{minor}}.{{patch}}
test:
  enable: true
