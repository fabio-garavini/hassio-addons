name: foldergram-aarch64
services:
  foldergram-aarch64:
    image: fabioogaravini/hassio-foldergram:${VERSION:-latest}-aarch64
    build:
      context: ..
      args:
        BUILD_ARCH: aarch64
        BUILD_VERSION: ${VERSION:-latest}
    container_name: foldergram-aarch64
    ports:
      - 4141:8080
    environment:
      - TZ=Etc/UTC
    volumes:
      - data:/data
      - ./options.json:/data/options.json:ro
      - config:/config
      - media:/media
      - share:/share
      - ssl:/ssl
    healthcheck:
      test: ["CMD-SHELL", "curl -kf https://127.0.0.1:8080 && curl -fk -H 'X-Ingress-Path: /api/hassio_ingress/test' https://127.0.0.1:8080/ | grep -q '<base href=\"/api/hassio_ingress/test/\"' && curl -fk -H 'X-Ingress-Path: /api/hassio_ingress/test' https://127.0.0.1:8080/ | grep -q '<link rel=\"manifest\" crossorigin=\"use-credentials\"' && curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099 | grep -qx 403"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  data:
  config:
  media:
  share:
  ssl:
