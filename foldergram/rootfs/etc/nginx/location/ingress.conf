# Foldergram uses root-relative assets and API URLs. Add Home Assistant's
# ingress prefix to responses while leaving direct access unchanged. Vue Router
# reads the injected base element and keeps client-side navigation under it.
sub_filter_once off;
sub_filter_types text/javascript application/javascript application/json application/manifest+json;
sub_filter '<head>' '<head><base href="$http_x_ingress_path/" />';
sub_filter '<link rel="manifest" href="/' '<link rel="manifest" crossorigin="use-credentials" href="$http_x_ingress_path/';
sub_filter 'src="/' 'src="$http_x_ingress_path/';
sub_filter 'href="/' 'href="$http_x_ingress_path/';
sub_filter '"src": "/' '"src": "$http_x_ingress_path/';
sub_filter '"start_url": "/"' '"start_url": "$http_x_ingress_path/"';
sub_filter '"scope": "/"' '"scope": "$http_x_ingress_path/"';
sub_filter '"/api/' '"$http_x_ingress_path/api/';
sub_filter "'/api/" "'$http_x_ingress_path/api/";
sub_filter '`/api/' '`$http_x_ingress_path/api/';
sub_filter '"/assets/' '"$http_x_ingress_path/assets/';
sub_filter '"/thumbnails/' '"$http_x_ingress_path/thumbnails/';
sub_filter '`/thumbnails/' '`$http_x_ingress_path/thumbnails/';
sub_filter '"/previews/' '"$http_x_ingress_path/previews/';
sub_filter '`/previews/' '`$http_x_ingress_path/previews/';
sub_filter '"/share/' '"$http_x_ingress_path/share/';
sub_filter '"/sw.js"' '"$http_x_ingress_path/sw.js"';
