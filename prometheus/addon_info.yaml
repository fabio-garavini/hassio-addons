source:
  type: docker
  repo: prom/prometheus
  current_version: v3.15.0
  version_template: regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
config:
  version_template: "{{major}}.{{minor}}.{{patch}}-ha{{app_build}}"
  build: 1
  image: fabioogaravini/hassio-prometheus
build:
  image: prom/prometheus
  version_template: v{{major}}.{{minor}}.{{patch}}
changelog:
  source: github-releases
  repo: prometheus/prometheus
  version_template: v{{major}}.{{minor}}.{{patch}}
test:
  enable: false
