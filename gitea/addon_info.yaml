source:
  type: docker
  repo: gitea/gitea
  current_version: 28.0.0
  version_template: regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
config:
  version_template: "{{major}}.{{minor}}.{{patch}}-ha{{app_build}}"
  build: 1
  image: fabioogaravini/hassio-gitea
build:
  image: gitea/gitea
  version_template: "{{major}}.{{minor}}.{{patch}}"
changelog:
  source: github-releases
  repo: go-gitea/gitea
  version_template: v{{major}}.{{minor}}.{{patch}}
test:
  enable: true
