name: Grimoire
version: 1.1.0
slug: grimoire
description: Bookmark manager for the wizards 🧙
url: https://github.com/goniszewski/grimoire
webui: "[PROTO:ssl]://[HOST]:[PORT:8080]"
arch:
  - aarch64
  - amd64
init: false
map:
  - type: app_config
    read_only: false
    path: /app/data
  - type: data
    read_only: false
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: ssl
backup: cold
schema:
  ssl: bool
  certfile: str?
  keyfile: str?
options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
ports:
  8080/tcp: 3210
ports_description:
  8080/tcp: Grimoire
image: fabioogaravini/hassio-grimoire
