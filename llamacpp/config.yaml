name: llama.cpp
version: 1.0.0-ha1
slug: llamacpp
description: Local LLM inference with a multi-model router and OpenAI-compatible API
url: https://github.com/ggml-org/llama.cpp
ingress: true
ingress_stream: true
panel_title: llama.cpp
panel_icon: mdi:forum
panel_admin: false
arch:
  - aarch64
  - amd64
init: false
video: true
hassio_api: true
discovery:
  - llama_cpp
map:
  - type: app_config
    read_only: false
  - type: share
    read_only: false
  - type: ssl
backup: cold
backup_exclude:
  - "**/logs"
  - "**/models"
  - "**/cache"
schema:
  ssl: bool
  certfile: str?
  keyfile: str?
  LLAMA_API_KEY: password?
  LLAMA_ARG_MODELS_DIR: match(^(/data/models|/(share|config)/.+)$)
  LLAMA_ARG_MODELS_PRESET: match(^/(share|config|data)/.+$)?
  LLAMA_ARG_MODELS_MAX: int(0,)?
  LLAMA_ARG_MODELS_MEMORY_MARGIN: int(0,)?
  LLAMA_ARG_MODELS_AUTOLOAD: bool
  LLAMA_ARG_CTX_SIZE: int(0,)?
  LLAMA_ARG_N_PARALLEL: match(^(-1|[1-9][0-9]*)$)?
  LLAMA_ARG_THREADS: int(-1,)?
  LLAMA_ARG_BATCH: int(1,)?
  LLAMA_ARG_UBATCH: int(1,)?
  LLAMA_ARG_N_PREDICT: int(-1,)?
  LLAMA_ARG_N_GPU_LAYERS: match(^(auto|all|[0-9]+)$)?
  LLAMA_ARG_EMBEDDINGS: bool
  LLAMA_ARG_RERANKING: bool?
  LLAMA_ARG_POOLING: list(none|mean|cls|last|rank)?
  LLAMA_ARG_FLASH_ATTN: list(on|off|auto)?
  LLAMA_ARG_CACHE_TYPE_K: list(f32|f16|bf16|f8_e4m3|q8_0|q4_0|q4_1|iq4_nl|q5_0|q5_1)?
  LLAMA_ARG_CACHE_TYPE_V: list(f32|f16|bf16|f8_e4m3|q8_0|q4_0|q4_1|iq4_nl|q5_0|q5_1)?
  LLAMA_ARG_KV_OFFLOAD: bool?
  LLAMA_ARG_REPACK: bool?
  LLAMA_ARG_LOAD_MODE: list(auto|none|mmap|mlock|mmap+mlock|dio)?
  LLAMA_ARG_LAZY_MODE: list(on|auto|off)?
  LLAMA_ARG_NUMA: list(distribute|isolate|numactl)?
  LLAMA_ARG_CPU_MOE: bool?
  LLAMA_ARG_N_CPU_MOE: int(0,)?
  LLAMA_ARG_MOE_CACHE_MIB: int(0,)?
  LLAMA_ARG_MOE_CACHE_CPU_SHARE: float(0.0,1.0)?
  LLAMA_ARG_N_CPU_FFN: int(0,)?
  LLAMA_ARG_FIT: bool?
  LLAMA_ARG_FIT_TARGET: str?
  LLAMA_ARG_FIT_CTX: int(0,)?
  LLAMA_ARG_RPC: str?
  LLAMA_ARG_MMPROJ_AUTO: bool?
  LLAMA_ARG_MMPROJ_OFFLOAD: bool?
  LLAMA_ARG_IMAGE_MIN_TOKENS: int(0,)?
  LLAMA_ARG_IMAGE_MAX_TOKENS: int(0,)?
  LLAMA_ARG_MTMD_BATCH_MAX_TOKENS: int(1,)?
  LLAMA_ARG_VIDEO_FPS: float(0.0,)?
  LLAMA_ARG_VIDEO_TIMESTAMP_INTERVAL: int(0,)?
  LLAMA_ARG_MEDIA_ALLOW_PRIVATE_URLS: bool?
  LLAMA_ARG_TEMPERATURE: float(0.0,)?
  LLAMA_ARG_TOP_K: int(0,)?
  LLAMA_ARG_TOP_P: float(0.0,1.0)?
  LLAMA_ARG_MIN_P: float(0.0,1.0)?
  LLAMA_ARG_REPEAT_PENALTY: match(^(?!0*\.?0*$)([0-9]+(\.[0-9]+)?|\.[0-9]+)$)?
  LLAMA_ARG_PRESENCE_PENALTY: float?
  LLAMA_ARG_FREQUENCY_PENALTY: float?
  LLAMA_ARG_BACKEND_SAMPLING: bool?
  LLAMA_ARG_CACHE_PROMPT: bool?
  LLAMA_ARG_CACHE_REUSE: int(0,)?
  LLAMA_ARG_CONTEXT_SHIFT: bool?
  LLAMA_ARG_CONT_BATCHING: bool?
  LLAMA_ARG_KV_UNIFIED: bool?
  LLAMA_ARG_KV_UNIFIED_PER_SLOT: int(0,)?
  LLAMA_ARG_CTX_CHECKPOINTS: int(0,)?
  LLAMA_ARG_CHECKPOINT_MIN_SPACING_NT: int(0,)?
  LLAMA_ARG_CACHE_RAM: int(-1,)?
  LLAMA_ARG_CACHE_IDLE_SLOTS: bool?
  LLAMA_ARG_JINJA: bool?
  LLAMA_ARG_THINK: list(auto|none|deepseek|deepseek-legacy)?
  LLAMA_ARG_REASONING: list(on|off|auto)?
  LLAMA_ARG_REASONING_EFFORT: str?
  LLAMA_ARG_THINK_BUDGET: int(-1,)?
  LLAMA_ARG_THINK_BUDGET_MESSAGE: str?
  LLAMA_ARG_REASONING_PRESERVE: bool?
  LLAMA_ARG_CHAT_TEMPLATE_KWARGS: str?
  LLAMA_ARG_SKIP_CHAT_PARSING: bool?
  LLAMA_ARG_PREFILL_ASSISTANT: bool?
  LLAMA_ARG_TIMEOUT: int(1,)?
  LLAMA_ARG_SSE_PING_INTERVAL: int(-1,)?
  LLAMA_ARG_THREADS_HTTP: int(-1,)?
  LLAMA_ARG_ENDPOINT_METRICS: bool?
  LLAMA_ARG_ENDPOINT_PROPS: bool?
  LLAMA_ARG_ENDPOINT_SLOTS: bool?
  LLAMA_ARG_CORS_ORIGINS: str?
  LLAMA_ARG_CORS_CREDENTIALS: bool?
  LLAMA_ARG_OFFLINE: bool?
  LLAMA_ARG_UI_CONFIG: str?
  LLAMA_ARG_LOG_VERBOSITY: list(0|1|2|3|4|5)?
  LLAMA_ARG_LOG_TIMESTAMPS: bool?
  env_vars:
    - key: match(^[A-Za-z0-9_-]+$)
      value: str
options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  LLAMA_ARG_MODELS_DIR: /data/models
  LLAMA_ARG_MODELS_AUTOLOAD: true
  LLAMA_ARG_EMBEDDINGS: true
  env_vars: []
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Web UI and OpenAI-compatible API (not required for Ingress)
image: fabioogaravini/hassio-llamacpp
