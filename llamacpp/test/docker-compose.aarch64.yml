name: llamacpp-aarch64
services:
  llamacpp-aarch64:
    image: fabioogaravini/hassio-llamacpp:${VERSION:-latest}-aarch64
    build:
      context: ..
      args:
        BUILD_ARCH: aarch64
        BUILD_VERSION: ${VERSION:-latest}
    container_name: llamacpp-aarch64
    ports:
      - 18080:8080
      - 18099:8099
    environment:
      - TZ=Etc/UTC
    volumes:
      - data:/data
      - ./options.json:/data/options.json:ro
      - config:/config
      - share:/share
      - ssl:/ssl
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health && curl -fsS http://127.0.0.1:8080/models && curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099 | grep -qx 403"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  data:
  config:
  share:
  ssl:
