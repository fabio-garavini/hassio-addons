source:
  type: github-releases
  repo: bookorbit/bookorbit
  current_version: v2.8.1
  version_template: regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
config:
  version_template: "{{major}}.{{minor}}.{{patch}}"
  patch: 0
  image: fabioogaravini/hassio-bookorbit
build:
  image: ghcr.io/bookorbit/bookorbit
  version_template: "{{major}}.{{minor}}.{{patch}}"
changelog:
  source: github-releases
  repo: bookorbit/bookorbit
  version_template: v{{major}}.{{minor}}.{{patch}}
test:
  enable: true
