name: BookOrbit
version: 2.7.0
slug: bookorbit
description: BookOrbit organizes your books and reads them back to you anywhere
url: https://bookorbit.app/
webui: "[PROTO:ssl]://[HOST]:[PORT:8080]"
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
map:
  - type: data
  - type: app_config
    read_only: false
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: ssl
backup: cold
backup_exclude:
  - "**/logs"
schema:
  TZ: str?
  ssl: bool
  certfile: str?
  keyfile: str?
  APP_URL: str?
  CLIENT_URL: str?
  BOOKS_HOST_PATH: str
  BOOK_DOCK_PATH: str?
  LIBRARY_BROWSE_ROOT: str
  BOOKORBIT_FIX_PERMISSIONS: bool
  PUID: int(0,)
  PGID: int(0,)
  env_vars:
    - key: match(^[A-Za-z0-9_-]+$)
      value: str
options:
  TZ: Etc/UTC
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  BOOKS_HOST_PATH: /media/bookorbit
  LIBRARY_BROWSE_ROOT: /books
  BOOKORBIT_FIX_PERMISSIONS: true
  PUID: 0
  PGID: 0
  env_vars: []
ports:
  8080/tcp: 3013
ports_description:
  8080/tcp: Web UI
image: fabioogaravini/hassio-bookorbit
