name: bookorbit-amd64
services:
  bookorbit-amd64:
    image: fabioogaravini/hassio-bookorbit:${VERSION:-latest}-amd64
    build:
      context: ..
      args:
        BUILD_ARCH: amd64
        BUILD_VERSION: ${VERSION:-latest}
    container_name: bookorbit-amd64
    ports:
      - 8080:8080
    environment:
      - TZ=Etc/UTC
    volumes:
      - data:/data
      - ./options.json:/data/options.json:ro
      - config:/config
      - media:/media
      - share:/share
      - ssl:/ssl
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  data:
  config:
  media:
  share:
  ssl:
