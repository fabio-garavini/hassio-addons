source:
  type: github-releases
  repo: nocodb/nocodb
  current_version: 2026.09.1
  version_template: regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
config:
  version_template: "{{major}}.{{minor}}.{{patch}}-ha{{app_build}}"
  build: 2
  image: fabioogaravini/hassio-nocodb
build:
  image: docker.io/nocodb/nocodb
  version_template: "{{major}}.{{minor}}.{{patch}}"
changelog:
  source: github-releases
  repo: nocodb/nocodb
  version_template: "{{major}}.{{minor}}.{{patch}}"
test:
  enable: true
